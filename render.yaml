databases:
  - name: healthcare-db
    plan: free
    databaseName: healthcare_db
    user: healthcare_user

services:
  - type: web
    name: healthcare-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @healthcare/api exec prisma generate && pnpm --filter @healthcare/api exec prisma migrate deploy
    startCommand: pnpm --filter @healthcare/api dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "24h"
      - key: LLM_PROVIDER
        value: mock
      - key: FRONTEND_URL
        value: https://healthcare-web-jevt.onrender.com
      - key: SLOT_HOLD_DURATION_MINUTES
        value: "5"
    healthCheckPath: /health

  - type: web
    name: healthcare-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && VITE_API_URL=https://healthcare-api-x70h.onrender.com pnpm --filter @healthcare/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://healthcare-api-x70h.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
